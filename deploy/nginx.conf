# nginx alternative to the Caddyfile (use one or the other, not both).
# Get certs first:  sudo certbot certonly --nginx -d chat.example.com
# Then:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/arbor
#        sudo ln -s /etc/nginx/sites-available/arbor /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name chat.example.com;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # v72: no add_header for Strict-Transport-Security / X-Content-Type-Options /
    # Referrer-Policy — the app sends them (helmet); adding them here duplicated them
    # (two HSTS headers with different max-age values).

    # v71 L2: Arbor keeps no IP addresses — nginx's default access log records
    # every client IP and full URL (including invite codes). Keep errors only.
    access_log off;
    error_log /var/log/nginx/arbor-error.log crit;

    # Attachments are base64 JSON bodies (the app itself caps them at 17 MB).
    client_max_body_size 28m;   # v71: 20 MB Premium attachments (base64 ≈ 27 MB)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app's rate limiting reads the real client IP through TRUST_PROXY=1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE event stream: disable buffering or messages arrive in bursts/never.
    location /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
