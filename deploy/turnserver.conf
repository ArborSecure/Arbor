# coturn config for self-hosted TURN (needed for calls across mobile/strict NATs).
#
#   sudo apt install coturn
#   sudo cp deploy/turnserver.conf /etc/turnserver.conf   # edit the marked lines
#   sudo systemctl enable --now coturn
#   Open firewall: 3478/tcp+udp, 5349/tcp, 49152-65535/udp
#
# Then in Arbor's .env:
#   TURN_URL=turn:turn.example.com:3478,turns:turn.example.com:5349
#   TURN_SECRET=<the same value as static-auth-secret below>
#
# Security review V8 L-3: this config used a STATIC long-term credential
# (lt-cred-mech + user=...) that Arbor handed to every account, never expiring —
# anyone who ever logged in once had a permanent free relay. It now uses the
# TURN REST-API scheme (use-auth-secret): Arbor mints a short-lived
# username/password (HMAC of the shared secret, expiring in ~2h) per request, so
# a leaked credential dies on its own and there is no password to rotate.
#
# (Managed alternatives if you'd rather not run this: Metered.ca free tier,
#  Twilio Network Traversal, Cloudflare Calls.)

listening-port=3478
tls-listening-port=5349

# EDIT: your server's public IP
external-ip=203.0.113.10
# EDIT: DNS name pointing at this box
realm=turn.example.com

# EDIT: shared secret (must equal TURN_SECRET in Arbor's .env). Generate with:
#   openssl rand -hex 32
use-auth-secret
static-auth-secret=CHANGE-THIS-TO-A-LONG-RANDOM-HEX-SECRET

# EDIT: reuse your Let's Encrypt cert for turns: (TLS) or delete these two lines
cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem

min-port=49152
max-port=65535

# Quotas: bound what any one credential (or the whole box) can relay.
user-quota=12
total-quota=1200
max-bps=3000000

# TURN relays media only — it can never see call content (DTLS-SRTP end-to-end).
no-multicast-peers
no-cli
no-rfc5780
no-stun-backward-compatibility
# WebRTC media is UDP; refusing TCP relay allocations removes the "generic TCP
# proxy" abuse surface (clients may still REACH the server over TCP/TLS).
no-tcp-relay

# Deny relaying into anything that isn't the public internet (SSRF hardening).
# IPv4 special-purpose ranges:
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
# IPv6: loopback/unspecified/IPv4-mapped+compatible, NAT64, discard, Teredo,
# documentation, 6to4, unique-local, link-local, multicast.
denied-peer-ip=::-::ffff:ffff:ffff
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# EDIT: also deny this box's OWN public address(es), so the relay can't be used
# to reach services bound on the TURN host itself (replace with external-ip):
denied-peer-ip=203.0.113.10

# v71 L2: no connection logs. coturn logs every allocation with the peers' IP
# addresses by default; keep only what's needed to operate the relay.
no-stdout-log
log-file=/dev/null
